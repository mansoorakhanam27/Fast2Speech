# Working configuration for the English FastSpeech 2 experiment.
# Dataset paths are local and intentionally excluded from version control.
language: en
dataset:
  name: Svarah
  manifest: ../data/Svarah/manifest.jsonl
  audio_root: ../data/Svarah
  target_train_hours: 5.0
  target_validation_hours: 1.0
  duration_tolerance_minutes: 5.0
  split_seed: 42
  # Export split manifests with tools/audit_manifests.py before preprocessing.
  train_manifest: ../data/Svarah/splits/train.jsonl
  validation_manifest: ../data/Svarah/splits/validation.jsonl
text:
  representation: phoneme
  cleaner: english_cleaners
  phonemizer: g2p_en
  language_code: en-us
  # MFA lexicon/acoustic model and speaker policy must be filled after corpus audit.
  aligner: montreal_forced_aligner
  dictionary: ../data/Svarah/mfa/english.dict
  acoustic_model: english_us_arpa
audio:
  sample_rate: 22050
  max_wav_value: 32768.0
  n_fft: 1024
  hop_length: 256
  win_length: 1024
  n_mels: 80
  mel_fmin: 0
  mel_fmax: 8000
variance:
  feature_level: phoneme_level
  normalize_pitch: true
  normalize_energy: true
model:
  encoder_layers: 4
  encoder_heads: 2
  encoder_hidden: 256
  decoder_layers: 4
  decoder_heads: 2
  decoder_hidden: 256
  variance_predictor_hidden: 128
  dropout: 0.1
  multi_speaker: false
  vocoder: HiFi-GAN
training:
  batch_size: 2
  gradient_accumulation_steps: 4
  max_steps: 30000
  validation_interval: 500
  checkpoint_interval: 2000
  seed: 42
  device: auto
paths:
  preprocessed: ../data/Svarah/preprocessed
  checkpoints: checkpoints
  results: ../Results/English
